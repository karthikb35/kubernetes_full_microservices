# TicketHub workloads — values drive one template set for all 9 services.
# The CI promote job (Ch 28) rewrites each service's `image:` line below to the
# signed GHCR digest; Argo CD renders this chart and rolls out the change.
namespace: tickethub
otelEndpoint: "otel-collector.monitoring.svc.cluster.local:4317"

# Defaults applied to every service unless overridden in its block.
defaults:
  replicas: 3
  containerPort: 8080
  servicePort: 80
  readinessPath: /readyz
  livenessPath: /healthz
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "512Mi" }
  hpa:
    enabled: false
    minReplicas: 3
    maxReplicas: 15
    targetCPU: 70
  pdb:
    enabled: true
    minAvailable: 2

# One-shot schema migration Job (Ch 11), run before the app serves traffic.
migrate:
  enabled: true
  image: registry.internal/tickethub/orders-migrate:v1
  command: ["/migrate", "up"]
  secretEnv:
    - { name: DB_PASSWORD, secret: orders-db, key: DB_PASSWORD }

services:
  gateway:
    image: ghcr.io/karthikb35/tickethub-gateway@sha256:57537b54399cbc05c828eea42188bccd7c16efa7480ef9698fc26cefa40de207
    servicePort: 8080
    configMap: gateway-config
    hpa: { enabled: true, minReplicas: 3, maxReplicas: 20, targetCPU: 70 }
    networkPolicy:
      ingress:
        - { fromAny: true, ports: [8080] }
      egress:
        - { toApps: [orders, catalog], ports: [8080] }

  frontend:
    image: ghcr.io/karthikb35/tickethub-frontend@sha256:739972486250ada3aaf5313d80fe0f958f7807ac0ead075af36d4dcbb96258f3
    servicePort: 80
    readinessPath: /
    livenessPath: /
    nginxWritableMounts: true
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
      limits: { cpu: "300m", memory: "256Mi" }
    hpa: { enabled: true, minReplicas: 3, maxReplicas: 15, targetCPU: 70 }
    networkPolicy:
      ingress:
        - { fromAny: true, ports: [8080] }

  orders:
    image: ghcr.io/karthikb35/tickethub-orders@sha256:f4288bd8c2bdf3b0c630d5cdc9905d37a4c613e7936c039268538086099fcb9a
    servicePort: 80
    configMap: orders-config
    metricsPort: 9090
    otel: true
    secretEnv:
      - { name: DB_PASSWORD, secret: orders-db, key: DB_PASSWORD }
    resources:
      requests: { cpu: "150m", memory: "192Mi" }
      limits: { cpu: "750m", memory: "768Mi" }
    # HPA stays raw (50-scaling/orders-hpa-custom.yaml — custom metrics).
    networkPolicy:
      ingress:
        - { fromApps: [gateway], ports: [8080] }
      egress:
        - { toApps: [payments], ports: [8080] }
        - { toNamespace: data, toApp: postgres, ports: [5432] }

  catalog:
    image: ghcr.io/karthikb35/tickethub-catalog@sha256:37ed7ba092a6531d46d1e6fde43599b097d1e6e12e6953deb83965dbf552b70a
    servicePort: 80
    configMap: catalog-config
    hpa: { enabled: true, minReplicas: 3, maxReplicas: 20, targetCPU: 70 }
    networkPolicy:
      ingress:
        - { fromApps: [gateway], ports: [8080] }
      egress:
        - { toApps: [search], ports: [8080] }

  users:
    image: ghcr.io/karthikb35/tickethub-users@sha256:a772123d9ea7ea44d07b3b215d03af954a6e8dff45978c32ae1e0258f1037e63
    servicePort: 80
    configMap: users-config
    hpa: { enabled: true, minReplicas: 3, maxReplicas: 15, targetCPU: 70 }
    networkPolicy:
      ingress:
        - { fromApps: [gateway], ports: [8080] }

  inventory:
    image: ghcr.io/karthikb35/tickethub-inventory@sha256:e878f1c8554274a2b74a0f1fb1786bfa6006b400dc1d20cc9dd66261c810b617
    servicePort: 80
    configMap: inventory-config
    hpa: { enabled: true, minReplicas: 3, maxReplicas: 15, targetCPU: 70 }
    networkPolicy:
      ingress:
        - { fromApps: [gateway, orders], ports: [8080] }

  payments:
    image: ghcr.io/karthikb35/tickethub-payments@sha256:68161055e0a9465d3f5f066e365197de595d6e07395b13e6ff9afc02f7885416
    servicePort: 80
    configMap: payments-config
    hpa: { enabled: true, minReplicas: 3, maxReplicas: 15, targetCPU: 70 }
    networkPolicy:
      ingress:
        - { fromApps: [orders], ports: [8080] }

  search:
    image: ghcr.io/karthikb35/tickethub-search@sha256:c0efe7ecc45ffd8e2195a72b06dfb3ca39264e202c059f401c509093942421b5
    servicePort: 80
    replicas: 2
    configMap: search-config
    pdb: { enabled: true, minAvailable: 1 }
    # HPA stays raw (50-scaling/search-vpa.yaml — VPA).
    networkPolicy:
      ingress:
        - { fromApps: [catalog], ports: [8080] }

  notifications:
    image: ghcr.io/karthikb35/tickethub-notifications@sha256:8ef7be0fb687b1ac73fdd78c869677b6986c1ea79ed7d2c53a9d16d4d5e30ded
    servicePort: 80
    replicas: 1
    configMap: notifications-config
    # Scaling via KEDA (50-scaling/notifications-keda.yaml).
    networkPolicy:
      egress:
        - { toNamespace: data, toApp: kafka, ports: [9092] }
