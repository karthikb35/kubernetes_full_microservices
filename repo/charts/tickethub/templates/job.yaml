{{- if .Values.migrate.enabled }}
# Schema migration Job — runs to completion before the app rolls out (Ch 11).
apiVersion: batch/v1
kind: Job
metadata:
  name: orders-db-migrate
  namespace: {{ .Values.namespace }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: { app: orders-migrate }
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: {{ .Values.migrate.image }}
          command: {{ .Values.migrate.command | toJson }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          {{- if .Values.migrate.secretEnv }}
          env:
            {{- range .Values.migrate.secretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef: { name: {{ .secret }}, key: {{ .key }} }
            {{- end }}
          {{- end }}
{{- end }}
