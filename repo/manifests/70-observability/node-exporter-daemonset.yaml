# node-exporter — one pod per node, tolerates all taints (Ch 11).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
  labels: { app: node-exporter }
spec:
  selector:
    matchLabels: { app: node-exporter }
  template:
    metadata:
      labels: { app: node-exporter }
    spec:
      hostNetwork: true
      tolerations:
        - operator: Exists          # land on tainted data/infra/control-plane nodes too
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.8.0
          args: ["--path.rootfs=/host"]
          ports:
            - containerPort: 9100
              hostPort: 9100
          resources:
            requests: { cpu: "50m", memory: 32Mi }
            limits:   { cpu: "150m", memory: 128Mi }
          volumeMounts:
            - name: rootfs
              mountPath: /host
              readOnly: true
      volumes:
        - name: rootfs
          hostPath: { path: / }
