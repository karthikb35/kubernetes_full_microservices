# KEDA event-driven scaling for notifications — scale on Kafka lag (Ch 16).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: notifications
  namespace: tickethub
spec:
  scaleTargetRef:
    name: notifications
  minReplicaCount: 0           # scale to zero when the topic is idle
  maxReplicaCount: 30
  pollingInterval: 15
  cooldownPeriod: 120
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-0.kafka.data:9092
        consumerGroup: notifications
        topic: ticket-events
        lagThreshold: "100"
