# TicketHub — private registry pull credentials (Ch 10).
#
# Images live in the private registry `registry.internal`. The kubelet needs a
# credential to pull them; this attaches the imagePullSecret to the tickethub
# namespace's default ServiceAccount so EVERY pod inherits it automatically.
#
# The Secret itself is NOT committed (it holds a real token). Create it once,
# out-of-band, or manage it with External Secrets / Sealed Secrets (Ch 13, 24):
#
#   kubectl create secret docker-registry registry-internal \
#     --namespace tickethub \
#     --docker-server=registry.internal \
#     --docker-username=ci-puller \
#     --docker-password="$REGISTRY_TOKEN"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: tickethub
imagePullSecrets:
  - name: registry-internal
