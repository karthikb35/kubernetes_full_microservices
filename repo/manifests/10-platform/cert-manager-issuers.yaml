# TicketHub — cert-manager ClusterIssuers (Ch 7).
#
# cert-manager (installed via Helm into the platform namespace) watches for the
# `cert-manager.io/cluster-issuer` annotation on Ingresses, obtains a Let's
# Encrypt certificate over ACME, stores it in the Ingress's tls secretName, and
# renews it automatically ~30 days before the 90-day expiry.
#
# Two issuers: validate against STAGING first (generous rate limits, untrusted
# certs), then switch the Ingress annotation to `letsencrypt` (production).
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: platform@tickethub.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt                 # referenced by ingress-tickethub.yaml
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform@tickethub.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      # HTTP-01: cert-manager serves the challenge token through the NGINX
      # Ingress. Use DNS-01 instead for wildcard certs (*.tickethub.com).
      - http01:
          ingress:
            ingressClassName: nginx
