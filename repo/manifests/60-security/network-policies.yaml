# Zero-trust networking: default-deny + explicit allows (Ch 21).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: tickethub
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-allow
  namespace: tickethub
spec:
  podSelector:
    matchLabels: { app: orders }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: gateway } }
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - podSelector: { matchLabels: { app: payments } }
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: data }
          podSelector: { matchLabels: { app: postgres } }
      ports:
        - { protocol: TCP, port: 5432 }
    - to: []                          # DNS — required once default-deny egress is on
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Gateway — edge service: accepts north-south traffic from the Gateway API
# dataplane, fans out to orders and catalog.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-allow
  namespace: tickethub
spec:
  podSelector:
    matchLabels: { app: gateway }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:                          # no 'from' => allowed from the ingress/Gateway layer
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - podSelector: { matchLabels: { app: orders } }
        - podSelector: { matchLabels: { app: catalog } }
      ports:
        - { protocol: TCP, port: 8080 }
    - to: []
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Frontend — edge service: serves static assets, no backend egress needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-allow
  namespace: tickethub
spec:
  podSelector:
    matchLabels: { app: frontend }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to: []
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Catalog — reached by the gateway, queries the search service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog-allow
  namespace: tickethub
spec:
  podSelector:
    matchLabels: { app: catalog }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: gateway } }
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - podSelector: { matchLabels: { app: search } }
      ports:
        - { protocol: TCP, port: 8080 }
    - to: []
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Payments — called only by the orders service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payments-allow
  namespace: tickethub
spec:
  podSelector:
    matchLabels: { app: payments }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: orders } }
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to: []
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Search — queried only by the catalog service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: search-allow
  namespace: tickethub
spec:
  podSelector:
    matchLabels: { app: search }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: catalog } }
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to: []
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Users — reached by the gateway for auth flows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: users-allow
  namespace: tickethub
spec:
  podSelector:
    matchLabels: { app: users }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: gateway } }
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to: []
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Inventory — reached by the gateway and the orders service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inventory-allow
  namespace: tickethub
spec:
  podSelector:
    matchLabels: { app: inventory }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: gateway } }
        - podSelector: { matchLabels: { app: orders } }
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to: []
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Notifications — Kafka consumer: no ingress from app pods; egress to Kafka in the
# data namespace plus DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notifications-allow
  namespace: tickethub
spec:
  podSelector:
    matchLabels: { app: notifications }
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: data }
          podSelector: { matchLabels: { app: kafka } }
      ports:
        - { protocol: TCP, port: 9092 }
    - to: []
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
