# ConfigMaps for TicketHub services — non-secret settings (Ch 13).
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-config
  namespace: tickethub
data:
  LOG_LEVEL: "info"
  PAYMENTS_URL: "http://payments.tickethub.svc.cluster.local"
  KAFKA_BROKERS: "kafka-0.kafka.data:9092,kafka-1.kafka.data:9092,kafka-2.kafka.data:9092"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
  namespace: tickethub
data:
  LOG_LEVEL: "info"
  SEARCH_URL: "http://search.tickethub.svc.cluster.local"
