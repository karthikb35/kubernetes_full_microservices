# Real credentials are synced from a vault by the External Secrets Operator (Ch 13, 24).
# Git stores only this REFERENCE, never the secret value.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: orders-db
  namespace: tickethub
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: orders-db                # creates/updates this native k8s Secret
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: tickethub/orders
        property: db_password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-db
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgres-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: tickethub/postgres
        property: password
