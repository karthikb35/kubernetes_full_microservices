# Resource governance for the app namespace (Ch 9, 15).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tickethub-quota
  namespace: tickethub
spec:
  hard:
    requests.cpu: "40"
    requests.memory: 80Gi
    limits.cpu: "80"
    limits.memory: 160Gi
    pods: "200"
    persistentvolumeclaims: "50"
    services.loadbalancers: "2"
---
# Default requests/limits so no container is ever "unbounded".
apiVersion: v1
kind: LimitRange
metadata:
  name: tickethub-defaults
  namespace: tickethub
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: 512Mi
      defaultRequest:
        cpu: "100m"
        memory: 128Mi
      max:
        cpu: "4"
        memory: 8Gi
