# Catalog service — stateless Deployment with zero-downtime rollout (Ch 11).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: tickethub
  labels: { app: catalog }
spec:
  replicas: 3
  selector:
    matchLabels: { app: catalog }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: { app: catalog }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: catalog
          image: ghcr.io/karthikb35/tickethub-catalog@sha256:a430d92ab843ab513634bcc2abb35a3de98ca114848b2c3850e48b6972ff2f7c
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: catalog-config }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "100m", memory: 128Mi }
            limits:   { cpu: "500m", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: tickethub
spec:
  selector: { app: catalog }
  ports:
    - port: 80
      targetPort: 8080
