# Notifications — Kafka consumer (orders.*, payments.*); scaled by KEDA on lag
# (Ch 11-12, 16). Exposes /healthz + /readyz and a status endpoint for scraping.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  namespace: tickethub
  labels: { app: notifications }
spec:
  replicas: 1                       # KEDA (Ch 16) scales this on consumer lag
  selector:
    matchLabels: { app: notifications }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: { app: notifications }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: notifications
          image: registry.internal/tickethub/notifications:v1
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: notifications-config }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "100m", memory: 128Mi }
            limits:   { cpu: "500m", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notifications
  namespace: tickethub
spec:
  selector: { app: notifications }
  ports:
    - { name: http, port: 80, targetPort: 8080 }
