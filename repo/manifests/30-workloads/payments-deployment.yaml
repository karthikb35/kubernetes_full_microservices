# Payments — charges orders; called by the orders service (Ch 11-12).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: tickethub
  labels: { app: payments }
spec:
  replicas: 3
  selector:
    matchLabels: { app: payments }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: { app: payments }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: payments
          image: registry.internal/tickethub/payments:v1
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: payments-config }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "100m", memory: 128Mi }
            limits:   { cpu: "500m", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: tickethub
spec:
  selector: { app: payments }
  ports:
    - { name: http, port: 80, targetPort: 8080 }
