# Frontend — static React app served by unprivileged NGINX (Ch 10-12).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tickethub
  labels: { app: frontend }
spec:
  replicas: 3
  selector:
    matchLabels: { app: frontend }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: { app: frontend }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: registry.internal/tickethub/frontend:v1
          ports:
            - { name: http, containerPort: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "50m", memory: 64Mi }
            limits:   { cpu: "300m", memory: 256Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            # NGINX needs writable temp/cache/run paths under a read-only rootfs.
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tickethub
spec:
  selector: { app: frontend }
  ports:
    # HTTPRoute (Ch 7) targets frontend on port 80.
    - { name: http, port: 80, targetPort: 8080 }
