# TicketHub — internal CA for service-to-service TLS/mTLS (Ch 7A).
#
# A self-signed issuer signs a long-lived root CA; the root becomes a CA
# ClusterIssuer that signs every internal service certificate. This is the
# private counterpart to the public Let's Encrypt issuer in Ch 7.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-root
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tickethub-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: tickethub-internal-ca
  secretName: tickethub-root-ca          # holds the CA key + cert
  duration: 87600h                       # 10 years
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-root
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: tickethub-internal              # referenced by per-service Certificates
spec:
  ca:
    secretName: tickethub-root-ca
