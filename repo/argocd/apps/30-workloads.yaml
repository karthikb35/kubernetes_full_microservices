# Application workloads — rendered from the Helm chart at repo/charts/tickethub
# (Deployment, Service, HPA, PDB, NetworkPolicy, migrate Job for all 9 services).
# The CI promote job rewrites the signed image digests in the chart's values.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tickethub-workloads
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://github.com/karthikb35/kubernetes_full_microservices.git
    targetRevision: main
    path: repo/charts/tickethub
    helm:
      releaseName: tickethub
  destination:
    server: https://kubernetes.default.svc
    namespace: tickethub
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
