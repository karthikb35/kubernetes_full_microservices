# Application workloads — Deployments + Services for the 9 services (Ch 11-12).
# The CI promote job rewrites the image references in this path to signed digests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tickethub-workloads
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://github.com/karthikb35/kubernetes_full_microservices.git
    targetRevision: main
    path: repo/manifests/30-workloads
  destination:
    server: https://kubernetes.default.svc
    namespace: tickethub
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
