# Config — ConfigMaps and ExternalSecret references, synced before the workloads
# that consume them via envFrom (Ch 13).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tickethub-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://git.internal/tickethub/platform.git
    targetRevision: main
    path: repo/manifests/40-config
  destination:
    server: https://kubernetes.default.svc
    namespace: tickethub
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
