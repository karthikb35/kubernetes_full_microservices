# Stateful data plane — Postgres, Redis, Kafka StatefulSets (Ch 11, 14).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tickethub-data
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/karthikb35/kubernetes_full_microservices.git
    targetRevision: main
    path: repo/manifests/20-data
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
