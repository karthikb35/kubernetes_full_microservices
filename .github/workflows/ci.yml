name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go services
    needs: [detect]
    if: needs.detect.outputs.go_services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.go_services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build, vet & test
        working-directory: repo/services/${{ matrix.service }}
        run: |
          go build ./...
          go vet ./...
          go test ./...

  python:
    name: Python stubs
    needs: [detect]
    if: needs.detect.outputs.run_python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check stubs
        run: python -m compileall repo/services
      - name: Smoke-test stubs
        run: python -m unittest tests/smoke_services.py

  frontend:
    name: Frontend build
    needs: [detect]
    if: needs.detect.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & build
        working-directory: repo/services/frontend
        run: |
          npm ci
          npm run build

  manifests:
    name: Validate manifests
    needs: [detect]
    if: needs.detect.outputs.run_manifests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          # prometheus-adapter-config.yaml and falco-rules.yaml are Helm *values*
          # fragments (no kind), not Kubernetes objects — skip them.
          args: -summary -ignore-missing-schemas -ignore-filename-pattern prometheus-adapter-config.yaml -ignore-filename-pattern falco-rules.yaml repo/manifests/

  detect:
    name: Detect changed services
    # Compute which service dirs changed so we only build/sign/publish (and only
    # test) what actually changed. Runs on push AND pull_request so PR checks are
    # scoped too; diffs against the right base for each event.
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changed.outputs.services }}
      go_services: ${{ steps.changed.outputs.go_services }}
      run_python: ${{ steps.changed.outputs.run_python }}
      run_frontend: ${{ steps.changed.outputs.run_frontend }}
      run_manifests: ${{ steps.changed.outputs.run_manifests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # need history to diff against the base commit
      - id: changed
        run: |
          ALL="frontend gateway orders users catalog inventory payments notifications search"
          GO_ALL="gateway orders"
          PY_ALL="users catalog inventory payments notifications search"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          HEAD="${{ github.sha }}"

          REBUILD_ALL=0
          DIFF=""
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            REBUILD_ALL=1                       # first push / unknown base: do everything
          else
            DIFF=$(git diff --name-only "$BASE" "$HEAD")
            # A change to the CI workflow itself exercises the whole pipeline.
            if echo "$DIFF" | grep -q '^.github/workflows/ci.yml$'; then REBUILD_ALL=1; fi
          fi

          if [ "$REBUILD_ALL" = "1" ]; then
            CHANGED="$ALL"; GO_CHANGED="$GO_ALL"; RUN_PY=true; RUN_FE=true; RUN_MF=true
          else
            CHANGED=""; GO_CHANGED=""; RUN_PY=false; RUN_FE=false; RUN_MF=false
            for s in $ALL; do
              if echo "$DIFF" | grep -q "^repo/services/$s/"; then CHANGED="$CHANGED $s"; fi
            done
            for s in $GO_ALL; do
              if echo "$DIFF" | grep -q "^repo/services/$s/"; then GO_CHANGED="$GO_CHANGED $s"; fi
            done
            for s in $PY_ALL; do
              if echo "$DIFF" | grep -q "^repo/services/$s/"; then RUN_PY=true; fi
            done
            # python smoke tests live outside service dirs
            if echo "$DIFF" | grep -q '^tests/'; then RUN_PY=true; fi
            if echo "$DIFF" | grep -q '^repo/services/frontend/'; then RUN_FE=true; fi
            if echo "$DIFF" | grep -q '^repo/manifests/'; then RUN_MF=true; fi
          fi

          json() { if [ -z "$1" ]; then echo '[]'; else printf '%s\n' $1 | jq -R . | jq -sc .; fi; }
          {
            echo "services=$(json "$CHANGED")"
            echo "go_services=$(json "$GO_CHANGED")"
            echo "run_python=$RUN_PY"
            echo "run_frontend=$RUN_FE"
            echo "run_manifests=$RUN_MF"
          } >> "$GITHUB_OUTPUT"
          echo "services: ${CHANGED:-<none>} | go: ${GO_CHANGED:-<none>} | python: $RUN_PY | frontend: $RUN_FE | manifests: $RUN_MF"

  images:
    name: Build & sign images
    # Only on pushes to main: never build/push/sign from pull requests (which may
    # come from forks and must not touch the registry or read signing secrets).
    # always() + result checks so a *skipped* test job (its service didn't change)
    # doesn't cascade-skip this job; a real test failure still blocks it.
    if: >-
      always() && !cancelled()
      && github.event_name == 'push'
      && needs.detect.outputs.services != '[]'
      && needs.go.result != 'failure'
      && needs.python.result != 'failure'
      && needs.frontend.result != 'failure'
    needs: [go, python, frontend, detect]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push images to GHCR via GITHUB_TOKEN
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        id: build
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/tickethub-${{ matrix.service }}"
          docker build -t "$IMAGE:${{ github.sha }}" "repo/services/${{ matrix.service }}"
          docker push "$IMAGE:${{ github.sha }}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}" | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (by digest)
        env:
          COSIGN_PRIVATE_KEY_B64: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY_B64" ]; then
            echo "::error::COSIGN_PRIVATE_KEY secret is empty or not set"; exit 1
          fi
          printf '%s' "$COSIGN_PRIVATE_KEY_B64" | base64 -d > cosign.key
          echo "decoded key size: $(wc -c < cosign.key) bytes"
          echo "first line: $(head -n1 cosign.key)"
          if ! head -n1 cosign.key | grep -q 'BEGIN ENCRYPTED SIGSTORE PRIVATE KEY'; then
            echo "::error::Decoded key is not a valid Cosign PEM. Re-set COSIGN_PRIVATE_KEY to the base64 of cosign.key"; exit 1
          fi
          IMG="ghcr.io/${{ github.repository_owner }}/tickethub-${{ matrix.service }}@${{ steps.build.outputs.digest }}"
          for attempt in 1 2 3 4 5; do
            if cosign sign --yes --key cosign.key "$IMG"; then
              signed=1; break
            fi
            echo "sign attempt $attempt failed (likely GHCR rate limit); backing off..."
            sleep $((attempt * 20))
          done
          rm -f cosign.key
          [ "${signed:-0}" = "1" ] || { echo "::error::cosign sign failed after retries"; exit 1; }

  cleanup-images:
    name: Prune old GHCR versions
    # Runs after images are built & signed; deletes stale versions so packages
    # don't accumulate one image + one .sig per commit forever. Only prunes the
    # services that were actually rebuilt this run.
    needs: [images, detect]
    if: >-
      always() && !cancelled()
      && github.event_name == 'push'
      && needs.detect.outputs.services != '[]'
      && needs.images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: write        # delete old package versions via GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    steps:
      - name: Delete untagged versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: tickethub-${{ matrix.service }}
          package-type: container
          delete-only-untagged-versions: 'true'

      - name: Keep only the most recent versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: tickethub-${{ matrix.service }}
          package-type: container
          min-versions-to-keep: 10   # ~5 recent image + .sig pairs
