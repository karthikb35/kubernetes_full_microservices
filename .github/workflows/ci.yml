name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, orders]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build, vet & test
        working-directory: repo/services/${{ matrix.service }}
        run: |
          go build ./...
          go vet ./...
          go test ./...

  python:
    name: Python stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check stubs
        run: python -m compileall repo/services
      - name: Smoke-test stubs
        run: python -m unittest tests/smoke_services.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & build
        working-directory: repo/services/frontend
        run: |
          npm ci
          npm run build

  manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          # prometheus-adapter-config.yaml and falco-rules.yaml are Helm *values*
          # fragments (no kind), not Kubernetes objects — skip them.
          args: -summary -ignore-missing-schemas -ignore-filename-pattern prometheus-adapter-config.yaml -ignore-filename-pattern falco-rules.yaml repo/manifests/
