name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, orders]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build, vet & test
        working-directory: repo/services/${{ matrix.service }}
        run: |
          go build ./...
          go vet ./...
          go test ./...

  python:
    name: Python stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check stubs
        run: python -m compileall repo/services
      - name: Smoke-test stubs
        run: python -m unittest tests/smoke_services.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & build
        working-directory: repo/services/frontend
        run: |
          npm ci
          npm run build

  manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          # prometheus-adapter-config.yaml and falco-rules.yaml are Helm *values*
          # fragments (no kind), not Kubernetes objects — skip them.
          args: -summary -ignore-missing-schemas -ignore-filename-pattern prometheus-adapter-config.yaml -ignore-filename-pattern falco-rules.yaml repo/manifests/

  images:
    name: Build & sign images
    # Only on pushes to main: never build/push/sign from pull requests (which may
    # come from forks and must not touch the registry or read signing secrets).
    if: github.event_name == 'push'
    needs: [go, python, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push images to GHCR via GITHUB_TOKEN
    strategy:
      matrix:
        service: [frontend, gateway, orders, users, catalog, inventory, payments, notifications, search]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        id: build
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/tickethub-${{ matrix.service }}"
          docker build -t "$IMAGE:${{ github.sha }}" "repo/services/${{ matrix.service }}"
          docker push "$IMAGE:${{ github.sha }}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}" | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (by digest)
        env:
          COSIGN_PRIVATE_KEY_B64: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "$COSIGN_PRIVATE_KEY_B64" | base64 -d > cosign.key
          cosign sign --yes --key cosign.key \
            ghcr.io/${{ github.repository_owner }}/tickethub-${{ matrix.service }}@${{ steps.build.outputs.digest }}
          rm -f cosign.key
