name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, orders]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build, vet & test
        working-directory: repo/services/${{ matrix.service }}
        run: |
          go build ./...
          go vet ./...
          go test ./...

  python:
    name: Python stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check stubs
        run: python -m compileall repo/services
      - name: Smoke-test stubs
        run: python -m unittest tests/smoke_services.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & build
        working-directory: repo/services/frontend
        run: |
          npm ci
          npm run build

  manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          # prometheus-adapter-config.yaml and falco-rules.yaml are Helm *values*
          # fragments (no kind), not Kubernetes objects — skip them.
          args: -summary -ignore-missing-schemas -ignore-filename-pattern prometheus-adapter-config.yaml -ignore-filename-pattern falco-rules.yaml repo/manifests/

  detect:
    name: Detect changed services
    # Only on pushes: compute which service directories actually changed so we
    # build/sign/publish just those, not all 9 every time.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changed.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # need history to diff against the previous commit
      - id: changed
        run: |
          ALL="frontend gateway orders users catalog inventory payments notifications search"
          BASE="${{ github.event.before }}"
          # First push to a branch (or missing base): build everything.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            CHANGED="$ALL"
          else
            DIFF=$(git diff --name-only "$BASE" "${{ github.sha }}")
            # A change to the CI workflow itself rebuilds everything (so pipeline
            # changes are actually exercised); otherwise match per-service dirs.
            if echo "$DIFF" | grep -q '^.github/workflows/ci.yml$'; then
              CHANGED="$ALL"
            else
              CHANGED=""
              for s in $ALL; do
                if echo "$DIFF" | grep -q "^repo/services/$s/"; then
                  CHANGED="$CHANGED $s"
                fi
              done
            fi
          fi
          if [ -z "$CHANGED" ]; then
            echo 'services=[]' >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s\n' $CHANGED | jq -R . | jq -sc .)
            echo "services=$JSON" >> "$GITHUB_OUTPUT"
          fi
          echo "changed services: ${CHANGED:-<none>}"

  images:
    name: Build & sign images
    # Only on pushes to main: never build/push/sign from pull requests (which may
    # come from forks and must not touch the registry or read signing secrets).
    if: github.event_name == 'push' && needs.detect.outputs.services != '[]'
    needs: [go, python, frontend, detect]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push images to GHCR via GITHUB_TOKEN
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        id: build
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/tickethub-${{ matrix.service }}"
          docker build -t "$IMAGE:${{ github.sha }}" "repo/services/${{ matrix.service }}"
          docker push "$IMAGE:${{ github.sha }}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}" | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (by digest)
        env:
          COSIGN_PRIVATE_KEY_B64: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY_B64" ]; then
            echo "::error::COSIGN_PRIVATE_KEY secret is empty or not set"; exit 1
          fi
          printf '%s' "$COSIGN_PRIVATE_KEY_B64" | base64 -d > cosign.key
          echo "decoded key size: $(wc -c < cosign.key) bytes"
          echo "first line: $(head -n1 cosign.key)"
          if ! head -n1 cosign.key | grep -q 'BEGIN ENCRYPTED SIGSTORE PRIVATE KEY'; then
            echo "::error::Decoded key is not a valid Cosign PEM. Re-set COSIGN_PRIVATE_KEY to the base64 of cosign.key"; exit 1
          fi
          IMG="ghcr.io/${{ github.repository_owner }}/tickethub-${{ matrix.service }}@${{ steps.build.outputs.digest }}"
          for attempt in 1 2 3 4 5; do
            if cosign sign --yes --key cosign.key "$IMG"; then
              signed=1; break
            fi
            echo "sign attempt $attempt failed (likely GHCR rate limit); backing off..."
            sleep $((attempt * 20))
          done
          rm -f cosign.key
          [ "${signed:-0}" = "1" ] || { echo "::error::cosign sign failed after retries"; exit 1; }

  cleanup-images:
    name: Prune old GHCR versions
    # Runs after images are built & signed; deletes stale versions so packages
    # don't accumulate one image + one .sig per commit forever. Only prunes the
    # services that were actually rebuilt this run.
    needs: [images, detect]
    if: github.event_name == 'push' && needs.detect.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      packages: write        # delete old package versions via GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    steps:
      - name: Delete untagged versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: tickethub-${{ matrix.service }}
          package-type: container
          delete-only-untagged-versions: 'true'

      - name: Keep only the most recent versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: tickethub-${{ matrix.service }}
          package-type: container
          min-versions-to-keep: 10   # ~5 recent image + .sig pairs
