name: Build & Release PDF

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install markdown xhtml2pdf Pillow

      - name: Build PDF
        run: python build_pdf.py

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-pdf
          name: "Latest PDF Build"
          prerelease: true
          files: k8s-architecture.pdf
